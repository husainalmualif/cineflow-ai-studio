name: CineFlow AI Studio CI (Skill, Rhythmic Montage, 7-Agent Orchestrator, MCP & Showrunner Validation)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  validate-skill-and-compiler:
    name: Validate Skill References, Pylint, Pytest (3 Suites), Beat Grid & Showrunner Tools
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Runtime, Lint & Test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify Skill References & Evals Synchronization Dynamically
        run: |
          python scripts/verify_skill_references.py

      - name: Lint All Scripts, MCP Server & Unit Tests with Pylint (via pyproject.toml)
        run: |
          pylint scripts/studio_config.py scripts/arabic_helpers.py scripts/governance_and_omni.py scripts/beat_grid.py scripts/cineflow_compiler.py scripts/multi_agent_orchestrator.py scripts/validate_package.py scripts/estimate_cost.py scripts/make_srt.py scripts/verify_skill_references.py scripts/sync_remotion_skills.py mcp/server.py tests/test_cineflow_compiler.py tests/test_montage.py tests/test_omni_agent.py

      - name: Run Automated Unit, Montage & MCP Agent Tests with Pytest
        run: |
          pytest -v tests/test_cineflow_compiler.py tests/test_montage.py tests/test_omni_agent.py

      - name: Test End-to-End Beat Grid -> Compiler -> Orchestrator -> Validator -> Cost -> SRT Interoperability
        run: |
          python scripts/beat_grid.py --bpm 120 --time-signature 4/4 --fps 30 --duration 15 --pattern build_up --output /tmp/test_beat_grid.json
          test -s /tmp/test_beat_grid.json
          python scripts/cineflow_compiler.py --output /tmp/test_blueprint.json
          test -s /tmp/test_blueprint.json
          python scripts/validate_package.py /tmp/test_blueprint.json
          python scripts/estimate_cost.py /tmp/test_blueprint.json 10 1
          python scripts/make_srt.py /tmp/test_blueprint.json /tmp/test_blueprint.srt
          test -s /tmp/test_blueprint.srt
          python scripts/multi_agent_orchestrator.py --validate-script examples/script_source.json --output-plan /tmp/test_plan.json
          test -s /tmp/test_plan.json
          python scripts/validate_package.py examples/example_01_commercial_promo.json
          python scripts/validate_package.py examples/example_02_explainer_and_story_script.json
          python scripts/validate_package.py examples/example_03_how_to_use_cineflow.json
          python scripts/validate_package.py examples/example_03_showrunner_package.json
          python scripts/validate_package.py examples/generated_perfume_ad.json
          python scripts/estimate_cost.py examples/example_03_showrunner_package.json 10 1
          python scripts/make_srt.py examples/example_03_showrunner_package.json /tmp/out.srt
          test -s /tmp/out.srt
