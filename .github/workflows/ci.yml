name: CineFlow AI Studio CI (Skill, 7-Agent Orchestrator & Showrunner Validation)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  validate-skill-and-compiler:
    name: Validate Skill Structure, Pylint, Unit Tests & Showrunner Package Tools
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Lint & Test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Skill Structure & Reference Files
        run: |
          test -f SKILL.md
          test -f README.md
          test -f requirements.txt
          test -f templates/package.template.json
          test -f references/01-team-and-roles.md
          test -f references/02-flow-rules.md
          test -f references/03-direction-and-audio.md
          test -f references/04-qa-and-errors.md
          test -f references/05-postproduction-marketing.md
          test -f references/06-browser-ops.md
          test -f references/07-field-tested-production-lessons.md
          test -f references/multi-agent-orchestrator.md
          test -f references/cinematic_macros_and_continuity.md
          test -f references/creative_strategy_and_marketing.md
          test -f references/scriptwriting_and_lip_sync_guide.md
          test -f references/programmatic_editing_and_motion_guide.md
          test -f resources/blueprint_schema.json
          test -f scripts/cineflow_compiler.py
          test -f scripts/multi_agent_orchestrator.py
          test -f scripts/validate_package.py
          test -f scripts/estimate_cost.py
          test -f scripts/make_srt.py
          test -f scripts/Compile-CineFlowBlueprint.ps1
          test -f examples/example_01_commercial_promo.json
          test -f examples/example_02_explainer_and_story_script.json
          test -f examples/example_03_showrunner_package.json
          grep -q "^name: cineflow-ai-studio" SKILL.md

      - name: Lint Compiler & Unit Tests with Pylint
        run: |
          pylint --disable=C0301,C0413,C0415,R0913,R0914,R0917 scripts/cineflow_compiler.py tests/test_cineflow_compiler.py

      - name: Run Automated Unit Tests with Pytest
        run: |
          pytest -v tests/test_cineflow_compiler.py

      - name: Test CLI Blueprint & Showrunner Package Validation
        run: |
          python scripts/cineflow_compiler.py --output /tmp/test_blueprint.json
          test -s /tmp/test_blueprint.json
          python scripts/validate_package.py examples/example_03_showrunner_package.json
          python scripts/estimate_cost.py examples/example_03_showrunner_package.json 10 1
          python scripts/make_srt.py examples/example_03_showrunner_package.json /tmp/out.srt
          test -s /tmp/out.srt
