name: CineFlow AI Studio CI (Skill, Rhythmic Montage, 7-Agent Orchestrator, MCP & Showrunner Validation)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  validate-skill-and-compiler:
    name: Validate Skill References, Pylint (21 Modules), Pytest (5 Suites), Multi-NLE & On-Demand Tool Factory
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Core Lint & Test dependencies (all Python versions)
        run: |
          python -m pip install --upgrade pip
          pip install pytest pylint jsonschema

      - name: Install optional MCP server dependencies (google-genai / mcp need Python >= 3.11)
        if: matrix.python-version != '3.9'
        run: pip install -r requirements-dev.txt

      - name: Verify Skill References & Evals Synchronization Dynamically
        run: |
          python scripts/verify_skill_references.py

      - name: Lint All Scripts, MCP Server & Unit Tests with Pylint (via pyproject.toml)
        run: |
          pylint scripts/studio_config.py scripts/arabic_helpers.py scripts/governance_and_omni.py scripts/beat_grid.py scripts/cineflow_compiler.py scripts/multi_agent_orchestrator.py scripts/validate_package.py scripts/estimate_cost.py scripts/make_srt.py scripts/verify_skill_references.py scripts/sync_remotion_skills.py scripts/lint_package.py scripts/post_production_engine.py scripts/nle_project_exporters.py scripts/on_demand_tool_synthesizer.py mcp/server.py tests/test_cineflow_compiler.py tests/test_montage.py tests/test_omni_agent.py tests/test_lint_package.py tests/test_post_and_tool_factory.py

      - name: Run Automated Unit, Montage, MCP Agent & v8.0.0 Post/NLE/Tool-Factory Tests with Pytest
        run: |
          pytest -v tests/test_cineflow_compiler.py tests/test_montage.py tests/test_omni_agent.py tests/test_lint_package.py tests/test_post_and_tool_factory.py

      - name: Test End-to-End Beat Grid -> Compiler -> Orchestrator -> Validator -> Cost -> SRT Interoperability
        run: |
          python scripts/beat_grid.py --bpm 120 --time-signature 4/4 --fps 30 --duration 15 --pattern build_up --output /tmp/test_beat_grid.json
          test -s /tmp/test_beat_grid.json
          python scripts/cineflow_compiler.py --output /tmp/test_blueprint.json
          test -s /tmp/test_blueprint.json
          python scripts/validate_package.py /tmp/test_blueprint.json
          python scripts/estimate_cost.py /tmp/test_blueprint.json 10 1
          python scripts/make_srt.py /tmp/test_blueprint.json /tmp/test_blueprint.srt
          test -s /tmp/test_blueprint.srt
          python scripts/multi_agent_orchestrator.py --validate-script examples/script_source.json --output-plan /tmp/test_plan.json
          test -s /tmp/test_plan.json
          python scripts/multi_agent_orchestrator.py --verify-plan examples/multi_agent_plan.json
          python scripts/lint_package.py check /tmp/test_blueprint.json
          python scripts/lint_package.py check examples/example_01_commercial_promo.json
          python scripts/lint_package.py check examples/example_03_showrunner_package.json
          python scripts/lint_package.py check examples/generated_perfume_ad.json
          python scripts/lint_package.py sanitize "35mm f/1.4 portrait, no text" > /tmp/test_sanitized.json
          test -s /tmp/test_sanitized.json
          python scripts/lint_package.py tool-payload hailuo_minimax "Luxury bottle on obsidian pedestal" --camera orbit_arc > /tmp/test_tool_payload.json
          test -s /tmp/test_tool_payload.json
          python scripts/lint_package.py cultural-audit "هَلَا وَاللَّه يَا الغَالِي" "Host holds brass Dallah in left hand and offers Finjan with right hand" --dialect SAUDI_NAJDI > /tmp/test_cultural_audit.json
          test -s /tmp/test_cultural_audit.json
          python scripts/multi_agent_orchestrator.py --verify-plan /tmp/test_plan.json
          python scripts/validate_package.py examples/example_01_commercial_promo.json
          python scripts/validate_package.py examples/example_02_explainer_and_story_script.json
          python scripts/validate_package.py examples/example_03_how_to_use_cineflow.json
          python scripts/validate_package.py examples/example_03_showrunner_package.json
          python scripts/validate_package.py examples/generated_perfume_ad.json
          python scripts/estimate_cost.py examples/example_03_showrunner_package.json 10 1
          python scripts/make_srt.py examples/example_03_showrunner_package.json /tmp/out.srt
          test -s /tmp/out.srt
          python scripts/post_production_engine.py probe > /tmp/test_probe.json
          test -s /tmp/test_probe.json
          python scripts/post_production_engine.py sfx whoosh_up --output /tmp/test_whoosh.wav
          test -s /tmp/test_whoosh.wav
          python scripts/post_production_engine.py loudness-plan --source-type own --measured-lufs -23.0 --measured-tp -5.0 > /tmp/test_loudness.json
          test -s /tmp/test_loudness.json
          python scripts/nle_project_exporters.py export-all /tmp/test_blueprint.json --output /tmp/test_nle_exports > /tmp/test_nle_summary.json
          test -s /tmp/test_nle_summary.json
          python scripts/on_demand_tool_synthesizer.py synthesize browser_nle_studio --output-dir /tmp/test_browser_nle --package /tmp/test_blueprint.json > /tmp/test_synth.json
          test -s /tmp/test_browser_nle/cineflow_studio_editor.html
          python scripts/lint_package.py synthesize-tool hyperframes_atelier_bundle --output-dir /tmp/test_hf_bundle --package /tmp/test_blueprint.json
          python scripts/lint_package.py validate-seams /tmp/test_hf_bundle/ledger.json
